[project]
name = "jipsa"
version = "0.1.0"
description = "여러 저장소의 Claude Code와 Codex 작업을 한곳에서 큐에 넣고 돌리고 보고하는 개인용 작업 지휘기. 등록부, 할 일 파일, 실행 파이프라인, 대시보드, 보고."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich>=13.7",
    "psutil>=5.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
jipsa = "scheduler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "scheduler", "notify"]
